apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - name: kafka
      port: 29092
      targetPort: 29092
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kafka-external
  labels:
    kubernetes.io/service-name: kafka
    endpointslice.kubernetes.io/managed-by: agentscope
addressType: IPv4
ports:
  - name: kafka
    protocol: TCP
    port: 29092
endpoints:
  - addresses:
      - "172.18.0.2"
    conditions:
      ready: true
