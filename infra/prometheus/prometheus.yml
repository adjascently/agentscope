global:
  scrape_interval: 5s
scrape_configs:
  - job_name: agentscope-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: agentscope-consumer
    static_configs:
      - targets: ["consumer:8002"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
